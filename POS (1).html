<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      color-scheme: light dark;
      --vh: 100vh;
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-elev: #ffffff;
      --text: #1d1d1f;
      --text-2: #6e6e73;
      --hairline: rgba(0, 0, 0, 0.08);
      --accent: #0a84ff;
      --accent-strong: #0071e3;
      --ok: #34c759;
      --ok-2: #eaf8ee;
      --danger: #dc3545;
      --warn: #d97706;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
      --r-sm: 12px;
      --r-md: 14px;
      --r-lg: 20px;
      --s-1: 4px;
      --s-2: 8px;
      --s-3: 12px;
      --s-4: 16px;
      --s-5: 24px;
      --s-6: 32px;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
    }
    @supports (height: 100dvh) {
      :root { --vh: 100dvh; }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --surface: #1c1c1e;
        --surface-elev: #2c2c2e;
        --text: #f5f5f7;
        --text-2: #98989d;
        --hairline: rgba(255, 255, 255, 0.1);
        --ok: #30d158;
        --ok-2: rgba(48, 209, 88, 0.15);
        --shadow: none;
      }
    }
    * { box-sizing: border-box; min-width: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: var(--vh);
      margin: 0;
      padding: 0;
      overflow-x: clip;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      font-size: clamp(15px, 3.5vw, 17px);
      line-height: 1.35;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      padding:
        calc(var(--s-4) + env(safe-area-inset-top))
        max(var(--s-3), env(safe-area-inset-right))
        calc(var(--s-6) + env(safe-area-inset-bottom))
        max(var(--s-3), env(safe-area-inset-left));
    }
    .app-shell {
      width: min(100%, 720px);
      margin: 0 auto;
      animation: app-enter 280ms var(--ease);
    }
    @keyframes app-enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--hairline);
      padding: var(--s-4);
      border-radius: var(--r-lg);
      margin-bottom: var(--s-4);
      box-shadow: var(--shadow);
    }
    h2 {
      margin: 0 0 var(--s-4);
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      letter-spacing: -0.01em;
      font-weight: 650;
      border: 0;
      padding: 0;
    }
    label {
      display: block;
      margin-top: var(--s-3);
      margin-bottom: var(--s-1);
      font-weight: 550;
      font-size: 0.8rem;
      letter-spacing: 0.01em;
      color: var(--text-2);
    }
    select, input, button {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      font-size: 16px;
      background: var(--surface-elev);
      color: var(--text);
      transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease), transform 140ms var(--ease);
    }
    input, select {
      min-height: 46px;
      padding: 0 var(--s-3);
    }
    button {
      min-height: 50px;
      margin-top: var(--s-4);
      border: 0;
      background: var(--text);
      color: var(--bg);
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
      cursor: pointer;
    }
    button:active { transform: scale(.97); }
    button:disabled {
      background: color-mix(in srgb, var(--text) 30%, var(--surface));
      color: color-mix(in srgb, var(--bg) 80%, transparent);
      cursor: not-allowed;
    }
    select:focus-visible, input:focus-visible, button:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    input::placeholder { color: color-mix(in srgb, var(--text-2) 85%, transparent); }
    ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
    .btn-add { background: var(--accent-strong); margin-top: var(--s-3); }
    .btn-remove {
      background: color-mix(in srgb, var(--danger) 16%, var(--surface));
      color: var(--danger);
      border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
      padding: 8px 12px;
      min-height: 44px;
      border-radius: var(--r-sm);
      width: auto;
      font-size: 0.85rem;
      margin: 0;
    }
    .cart-item { display: flex; flex-direction: column; padding: 12px 0; border-bottom: 1px solid var(--hairline); gap: 8px; }
    .cart-item:last-child { border-bottom: 0; }
    .cart-item-header { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; overflow-wrap: anywhere; }
    .cart-item-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .cart-item-controls input { margin: 0; min-height: 44px; padding: 0 10px; font-size: 16px; }
    .cart-total {
      font-weight: 750;
      font-size: clamp(1.15rem, 4.8vw, 1.45rem);
      margin-top: var(--s-3);
      text-align: right;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .header-bar {
      position: sticky;
      top: 0;
      z-index: 12;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: calc(-1 * var(--s-2)) calc(-1 * var(--s-1)) var(--s-4);
      padding: var(--s-2) var(--s-2);
      border-radius: var(--r-md);
      border: 1px solid var(--hairline);
      background: color-mix(in srgb, var(--bg) 84%, transparent);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      overflow: hidden;
    }
    .brand-text { font-size: clamp(.78rem, 2.9vw, .95rem); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-text strong { font-weight: 820; letter-spacing: -0.03em; }
    .header-tools { display: flex; align-items: center; gap: 8px; }
    #pos-staff-badge {
      color: var(--text-2);
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      white-space: nowrap;
      max-width: 32vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #admin-branch-select {
      width: auto !important;
      max-width: 34vw;
      min-height: 44px;
      padding-right: 28px;
      font-size: 0.84rem;
      background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
      background-position: calc(100% - 16px) calc(50% - 2px), calc(100% - 10px) calc(50% - 2px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }
    .btn-logout {
      background: color-mix(in srgb, var(--danger) 14%, var(--surface));
      color: var(--danger);
      border: 1px solid color-mix(in srgb, var(--danger) 32%, transparent);
      min-height: 44px;
      margin: 0;
      width: auto;
      border-radius: 12px;
      padding: 0 12px;
      font-size: 0.82rem;
    }
    .error { color: var(--danger); font-weight: 600; text-align: center; margin-bottom: 10px; display: none; }
    .login-overlay, .success-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: var(--vh);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
    }
    .login-overlay {
      background:
        radial-gradient(120% 95% at 50% 0%, color-mix(in srgb, var(--ok) 10%, transparent), transparent 62%),
        radial-gradient(120% 80% at 100% 100%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 68%),
        var(--bg);
      color: var(--text);
      overscroll-behavior: none;
      overflow: hidden;
      touch-action: none;
    }
    .auth-card {
      width: min(92vw, 360px);
      background: var(--surface);
      border: 1px solid var(--hairline);
      padding: var(--s-5) var(--s-4);
      border-radius: 22px;
      box-shadow: var(--shadow);
      margin: auto;
      animation: auth-in 350ms var(--ease);
    }
    @keyframes auth-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .auth-card.shake { animation: auth-shake 360ms var(--ease); }
    @keyframes auth-shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .wordmark {
      text-align: center;
      margin-bottom: var(--s-2);
      line-height: 1.1;
    }
    .wordmark-main { display: block; font-size: clamp(1.6rem, 8vw, 2.25rem); font-weight: 850; letter-spacing: -0.03em; }
    .wordmark-sub { display: block; margin-top: 4px; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-2); }
    .auth-label { text-align: center; margin-top: 0; }
    #pin-input {
      text-align: center;
      font-size: clamp(1.4rem, 7vw, 1.8rem);
      letter-spacing: 0.25em;
      min-height: 56px;
      background: color-mix(in srgb, var(--ok-2) 40%, var(--surface));
      border-color: color-mix(in srgb, var(--ok) 35%, var(--hairline));
    }
    #login-btn {
      background: var(--ok);
      color: #fff;
    }
    .success-overlay {
      display: none;
      background: color-mix(in srgb, #000 78%, transparent);
      backdrop-filter: saturate(180%) blur(10px);
      -webkit-backdrop-filter: saturate(180%) blur(10px);
      padding: var(--s-4);
    }
    .success-card {
      width: min(100%, 420px);
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--hairline);
      border-radius: 20px;
      padding: var(--s-5) var(--s-4);
      box-shadow: var(--shadow);
      text-align: center;
      transform: translateY(8px);
      animation: success-up 420ms var(--ease);
    }
    @keyframes success-up {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .success-badge {
      width: 74px;
      height: 74px;
      margin: 0 auto var(--s-3);
      border-radius: 999px;
      background: var(--ok-2);
      border: 2px solid color-mix(in srgb, var(--ok) 42%, transparent);
      position: relative;
    }
    .success-badge::after {
      content: "";
      position: absolute;
      left: 23px;
      top: 19px;
      width: 22px;
      height: 12px;
      border: 3px solid var(--ok);
      border-top: 0;
      border-right: 0;
      transform: rotate(-45deg) scale(0.85);
      transform-origin: left top;
      opacity: .92;
      animation: tick-in 450ms var(--ease);
    }
    @keyframes tick-in {
      from { opacity: 0; transform: rotate(-45deg) scale(0.4); }
      to { opacity: .92; transform: rotate(-45deg) scale(0.85); }
    }
    .success-overlay h1, .login-overlay h1 { font-size: 1.5rem; margin: 0 0 8px; text-align: center; border: none; }
    .hidden { display: none !important; }
    .inventory-list {
      max-height: min(50dvh, 420px);
      max-height: min(50vh, 420px);
      overflow-y: auto;
      overscroll-behavior: contain;
      border: 1px solid var(--hairline);
      border-radius: 14px;
      margin-top: 10px;
      background: color-mix(in srgb, var(--surface) 92%, var(--bg));
    }
    .inv-item {
      min-height: 52px;
      padding: 12px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: background-color 180ms var(--ease), border-color 180ms var(--ease);
    }
    .inv-item:last-child { border-bottom: none; }
    .inv-item.selected {
      background: color-mix(in srgb, var(--accent) 16%, var(--surface));
      border-left: 4px solid var(--accent-strong);
      padding-left: 8px;
    }
    .inv-item.out-of-stock { opacity: 0.5; pointer-events: none; }
    .inv-item.out-of-stock .inv-item-meta::after {
      content: " • Out of stock";
      display: inline-block;
      margin-left: 6px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
      color: var(--danger);
      font-size: 0.68rem;
    }
    .inv-item-details { display: flex; flex-direction: column; overflow: hidden; }
    .inv-item-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .inv-item-meta { font-size: 0.8rem; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .inv-item-price { font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .search-bar { margin-bottom: 5px; }
    .inventory-list > div:not(.inv-item), #cart-items > div[style*="Cart is empty"] {
      padding: 18px !important;
      text-align: center !important;
      color: var(--text-2) !important;
      font-size: 0.92rem !important;
    }
    .summary-card {
      margin-top: 15px;
      background: color-mix(in srgb, var(--surface) 92%, var(--bg));
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--hairline);
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 1rem;
      margin-top: 5px;
      font-variant-numeric: tabular-nums;
    }
    .summary-balance {
      font-size: 1.16rem;
      font-weight: 700;
      border-top: 1px solid var(--hairline);
      padding-top: 7px;
      margin-top: 8px;
    }
    .mono-chip {
      margin-bottom: 25px;
      font-size: 1.05rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--ok);
      border: 1px solid color-mix(in srgb, var(--ok) 32%, transparent);
      background: var(--ok-2);
      border-radius: 999px;
      display: inline-block;
      max-width: 100%;
      word-break: break-all;
      padding: 8px 12px;
    }
    .new-sale-btn {
      width: 100%;
      max-width: 320px;
      margin-inline: auto;
      background: var(--accent-strong);
      padding: 15px;
      border-radius: 12px;
      font-size: 1rem;
    }
    #checkout-btn { min-height: 52px; }
    .section-head { margin-top: 15px; border-top: 1px solid var(--hairline); padding-top: 10px; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text);
      transition: background-color 9999s ease-out 0s;
      box-shadow: 0 0 0 1000px var(--surface-elev) inset;
    }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text-2) 45%, transparent); border-radius: 999px; }
    @media (max-width: 370px) {
      .header-tools { gap: 6px; }
      #pos-staff-badge { display: none; }
      .grid-2 { grid-template-columns: 1fr; }
      .cart-item-controls input[style*="120px"] { width: 100% !important; }
    }
    @supports selector(body:has(#login-screen:not(.hidden))) {
      body:has(#login-screen:not(.hidden)) .app-shell { visibility: hidden; }
      body:has(#login-screen:not(.hidden)) { overflow: hidden; }
    }
    body.auth-active .app-shell { visibility: hidden; }
    body.auth-active { overflow: hidden; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <!-- PIN LOGIN SCREEN -->
  <div id="login-screen" class="login-overlay hidden">
    <div class="auth-card">
      <h1 class="wordmark"><span class="wordmark-main">ANA</span><span class="wordmark-sub">Accessories</span></h1>
      <label class="auth-label">Enter Staff PIN</label>
      <input type="password" id="pin-input" pattern="[0-9]*" inputmode="numeric">
      <button id="login-btn">LOGIN</button>
      <div id="login-error" class="error" style="margin-top:15px; font-size: 0.85rem;"></div>
    </div>
  </div>

  <div id="app-shell" class="app-shell">
  <!-- HEADER -->
  <div class="header-bar">
    <div class="brand-text"><strong>ANA</strong> Accessories / POS</div>
    <div class="header-tools">
      <span id="pos-staff-badge"></span>
      <select id="admin-branch-select" class="hidden">
        <option value="AdjeiMess Hostel">AdjeiMess</option>
        <option value="Winta Hostel">Winta</option>
      </select>
      <button class="btn-logout" id="logout-btn">Logout</button>
    </div>
  </div>

  <!-- ADD TO CART SECTION -->
  <div class="card">
    <h2>1. ADD TO CART</h2>
    
    <div class="grid-2 search-bar">
      <input type="search" id="inv-search" placeholder="Search product...">
      <select id="inv-category">
        <option value="All">All Categories</option>
      </select>
    </div>
    
    <div class="inventory-list" id="inventory-list">
      <!-- Populated by JS -->
      <div style="padding:15px; text-align:center; color:#666;">Loading inventory...</div>
    </div>

    <div class="grid-2" style="margin-top: 10px;">
      <div>
        <label>Selected Price</label>
        <input type="text" id="selected-price" value="0.00" disabled>
      </div>
      <div>
        <label>Qty to Add</label>
        <input type="number" id="qty-input" value="1" min="1" step="1">
      </div>
    </div>
    
    <button class="btn-add" id="add-to-cart-btn" disabled>+ Add Selected Item</button>
  </div>

  <!-- CART SUMMARY SECTION -->
  <div class="card">
    <h2>2. CART SUMMARY</h2>
    <div id="cart-items"></div>
    <div class="cart-total" id="cart-total">TOTAL: 0.00</div>
  </div>

  <!-- CHECKOUT SECTION -->
  <div class="card">
    <h2>3. CHECKOUT</h2>
    
    <label>Customer Type</label>
    <select id="cust-type">
      <option value="Unknown">Unknown</option>
      <option value="Continuing Student">Continuing Student</option>
      <option value="Freshman">Freshman</option>
      <option value="Friend">Friend</option>
      <option value="Referrer">Referrer</option>
      <option value="Outsider">Outsider</option>
    </select>
    
    <div id="cust-name-container" class="hidden">
      <label>Customer Name (Required for Credit)</label>
      <input type="text" id="cust-name" placeholder="Enter name">
    </div>

    <label class="section-head">MONEY IN (What they handed you)</label>
    <div class="grid-2">
      <div><label>Cash In</label><input type="number" id="cash-in" class="pay-input" value="0" min="0" step="0.01"></div>
      <div><label>MoMo In</label><input type="number" id="momo-in" class="pay-input" value="0" min="0" step="0.01"></div>
    </div>
    <label>Bank In</label><input type="number" id="bank-in" class="pay-input" value="0" min="0" step="0.01">
    
    <label class="section-head">CHANGE OUT (What you gave back)</label>
    <div class="grid-2">
      <div><label>Cash Out</label><input type="number" id="cash-out" class="pay-input" value="0" min="0" step="0.01"></div>
      <div><label>MoMo Out</label><input type="number" id="momo-out" class="pay-input" value="0" min="0" step="0.01"></div>
    </div>

    <div class="summary-card">
      <div class="summary-row"><span>Total Due:</span> <span id="sum-total">0.00</span></div>
      <div class="summary-row"><span>Net Paid:</span> <span id="sum-paid">0.00</span></div>
      <div class="summary-row summary-balance"><span>Balance:</span> <span id="sum-balance">0.00</span></div>
    </div>

    <div id="checkout-error" class="error" style="margin-top:15px; font-size: 0.9rem;"></div>
    <button id="checkout-btn">SUBMIT SALE</button>
  </div>
  </div>

  <!-- SUCCESS SCREEN -->
  <div id="success-screen" class="success-overlay">
    <div class="success-card">
      <div class="success-badge" aria-hidden="true"></div>
      <h1>SALE LOGGED</h1>
      <p style="margin-bottom: 10px; font-size: 1rem; color: var(--text-2);">Transaction pushed to ledger.</p>
      <p id="success-trans-id" class="mono-chip"></p>
      <button class="new-sale-btn" id="new-sale-btn">NEW SALE</button>
    </div>
  </div>

  <script>
    (function () {
      try {
        const loginScreen = document.getElementById('login-screen');
        const loginBtn = document.getElementById('login-btn');
        const pinInput = document.getElementById('pin-input');
        const loginError = document.getElementById('login-error');
        const appShell = document.getElementById('app-shell');
        if (!loginScreen || !loginBtn || !pinInput || !loginError || !appShell) return;

        let armed = false;
        let fxEl = null;

        const setAuthLock = () => {
          document.body.classList.toggle('auth-active', !loginScreen.classList.contains('hidden'));
        };

        const makeFx = () => {
          if (fxEl) return fxEl;
          const el = document.createElement('div');
          el.id = 'auth-fx';
          el.setAttribute('aria-hidden', 'true');
          el.style.cssText = "position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.18);z-index:10001;pointer-events:none;";
          el.innerHTML = '<div style="width:96px;height:96px;border-radius:999px;background:var(--ok-2);border:2px solid color-mix(in srgb, var(--ok) 44%, transparent);position:relative;"><svg viewBox=\"0 0 64 64\" width=\"64\" height=\"64\" style=\"position:absolute;left:16px;top:16px;\"><path d=\"M14 34l12 12 24-24\" fill=\"none\" stroke=\"var(--ok)\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"50\" stroke-dashoffset=\"50\"></path></svg></div>';
          document.body.appendChild(el);
          fxEl = el;
          return fxEl;
        };

        const playSuccessFx = () => {
          const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          const fx = makeFx();
          const tick = fx.querySelector('path');
          fx.style.display = 'flex';
          appShell.style.transition = 'opacity 320ms var(--ease), transform 320ms var(--ease)';
          appShell.style.opacity = '0.92';
          appShell.style.transform = 'translateY(8px)';
          if (tick && !reduceMotion) {
            tick.style.transition = 'stroke-dashoffset 300ms var(--ease) 230ms';
            tick.style.strokeDashoffset = '0';
          } else if (tick) {
            tick.style.strokeDashoffset = '0';
          }
          setTimeout(() => {
            fx.style.transition = reduceMotion ? 'opacity 150ms ease' : 'opacity 220ms var(--ease), transform 220ms var(--ease)';
            fx.style.opacity = '0';
            if (!reduceMotion) fx.style.transform = 'scale(1.04)';
            appShell.style.opacity = '';
            appShell.style.transform = '';
            navigator.vibrate && navigator.vibrate(15);
          }, reduceMotion ? 120 : 700);
          setTimeout(() => {
            fx.style.display = 'none';
            fx.style.opacity = '';
            fx.style.transform = '';
            if (tick) {
              tick.style.transition = '';
              tick.style.strokeDashoffset = '50';
            }
          }, reduceMotion ? 290 : 940);
        };

        loginBtn.addEventListener('click', () => { armed = true; }, true);
        pinInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') armed = true; }, true);

        new MutationObserver(() => {
          setAuthLock();
          const hiddenNow = loginScreen.classList.contains('hidden');
          if (armed && hiddenNow) {
            armed = false;
            playSuccessFx();
          }
        }).observe(loginScreen, { attributes: true, attributeFilter: ['class'] });

        new MutationObserver(() => {
          const shown = loginError.style.display === 'block';
          if (shown) {
            armed = false;
            const card = loginScreen.querySelector('.auth-card');
            if (!card) return;
            card.classList.remove('shake');
            void card.offsetWidth;
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 420);
          }
        }).observe(loginError, { attributes: true, attributeFilter: ['style'] });

        setAuthLock();
      } catch (e) {
        console.warn('Auth visual effects disabled:', e);
      }
    })();
  </script>

  <script>
    // ==========================================
    // CONFIGURATION & STATE
    // ==========================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbyScU76FT_DCDLPkte-yl5BrsL2HJliLPZGcKrAtsy1YeoSHY5aa48-OIIeL9d6mJwlkg/exec';
    const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
    
    let state = {
      user: null, // {name, role, branch}
      token: null,
      inventory: [],
      selectedItem: null,
      cart: [],
      hiddenAt: 0
    };

    // Load persisted state
    try {
      const savedUser = localStorage.getItem('ana_pos_user');
      const savedToken = localStorage.getItem('ana_pos_token');
      const savedCart = localStorage.getItem('ana_pos_cart');
      if (savedUser && savedToken) {
        state.user = JSON.parse(savedUser);
        state.token = savedToken;
      }
      if (savedCart) {
        const parsed = JSON.parse(savedCart);
        if (Array.isArray(parsed)) {
          state.cart = parsed.filter(c => {
            if (typeof c.item !== 'string' || !c.item.trim()) return false;
            if (!Number.isFinite(c.price)) return false;
            if (!Number.isInteger(c.qty) || c.qty < 1) return false;
            if ('priceOverride' in c) {
              if (!Number.isFinite(c.priceOverride) || c.priceOverride <= 0) {
                delete c.priceOverride;
              }
            }
            return true;
          });
        }
      }
    } catch (e) { console.warn("Local storage parse error", e); }

    // ==========================================
    // CORE API WRAPPER
    // ==========================================
    async function apiCall(action, payload = {}, includeRequestId = false) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000); // 30s timeout
      
      const body = {
        action: action,
        token: state.token,
        payload: payload
      };

      if (includeRequestId) {
        let pending = JSON.parse(localStorage.getItem('ana_pos_pending_req') || 'null');
        
        if (pending && JSON.stringify(pending.payload) === JSON.stringify(payload)) {
          body.requestId = pending.requestId;
        } else {
          body.requestId = 'REQ-' + crypto.randomUUID();
          localStorage.setItem('ana_pos_pending_req', JSON.stringify({
            requestId: body.requestId,
            payload: payload,
            uncertain: false,
            acknowledged: false
          }));
        }
      }

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body),
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        const data = await response.json();
        
        if (data.sessionExpired) {
          handleLogout(true);
          throw new Error("Session expired. Please login again.");
        }
        return data;
      } catch (err) {
        clearTimeout(timeoutId);
        if (err.name === 'AbortError') throw new Error("Network timeout (30s). Check your connection.");
        throw err;
      }
    }

    // ==========================================
    // INITIALIZATION & WAKE-UP
    // ==========================================
    document.addEventListener("DOMContentLoaded", () => {
      bindEvents();
      if (state.token && state.user) {
        document.getElementById('login-screen').classList.add('hidden');
        setupUIForUser();
        fetchInventory();
        renderCart();
      } else {
        document.getElementById('login-screen').classList.remove('hidden');
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        state.hiddenAt = Date.now();
      } else {
        if (state.token && state.hiddenAt && (Date.now() - state.hiddenAt > 45000)) {
          fetchInventory();
        }
      }
    });

    // ==========================================
    // PENDING SALE WARNING GUARD
    // ==========================================
    function checkPendingWarning() {
      const pendingStr = localStorage.getItem('ana_pos_pending_req');
      if (pendingStr) {
        const pending = JSON.parse(pendingStr);
        if (pending.uncertain && !pending.acknowledged) {
          if (!confirm("Your last sale was not confirmed and may already be recorded. Check before continuing.")) {
            return false;
          }
          pending.acknowledged = true;
          localStorage.setItem('ana_pos_pending_req', JSON.stringify(pending));
        }
      }
      return true;
    }

    function handleInputFocus(e) {
      const pendingStr = localStorage.getItem('ana_pos_pending_req');
      if (pendingStr) {
        const pending = JSON.parse(pendingStr);
        if (pending.uncertain && !pending.acknowledged) {
          if (!confirm("Your last sale was not confirmed and may already be recorded. Check before continuing.")) {
            e.target.blur();
          } else {
            pending.acknowledged = true;
            localStorage.setItem('ana_pos_pending_req', JSON.stringify(pending));
          }
        }
      }
    }

    // ==========================================
    // AUTHENTICATION
    // ==========================================
    async function handleLogin() {
      const btn = document.getElementById('login-btn');
      if (btn.disabled) return;
      
      const pinInput = document.getElementById('pin-input');
      const errDiv = document.getElementById('login-error');
      const pin = pinInput.value.trim();

      errDiv.style.display = 'none';
      if (!/^\d{6,}$/.test(pin)) {
        errDiv.textContent = "PIN must be at least 6 digits.";
        errDiv.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = "VERIFYING...";

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 30000);
        
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: "login", payload: { pin: pin } }),
          signal: controller.signal
        });
        clearTimeout(timeout);
        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error || "Login failed");
        }

        state.token = data.token;
        state.user = data.user;
        localStorage.setItem('ana_pos_token', data.token);
        localStorage.setItem('ana_pos_user', JSON.stringify(data.user));
        
        pinInput.value = "";
        document.getElementById('login-screen').classList.add('hidden');
        setupUIForUser();
        fetchInventory();
        updatePaymentTotals();

      } catch (err) {
        errDiv.textContent = err.name === 'AbortError' ? "Network timeout." : err.message;
        errDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = "LOGIN";
      }
    }

    async function handleLogout(isExpiry = false) {
      if (!isExpiry) {
        if (!confirm("Are you sure you want to logout? This will clear your cart and pending transactions.")) return;
        state.cart = [];
        localStorage.removeItem('ana_pos_cart');
        localStorage.removeItem('ana_pos_pending_req');
        renderCart();
      }

      if (state.token) {
        try { await apiCall("logout"); } catch(e) {} 
      }
      state.token = null;
      state.user = null;
      localStorage.removeItem('ana_pos_token');
      localStorage.removeItem('ana_pos_user');
      
      document.getElementById('pos-staff-badge').textContent = "";
      document.getElementById('admin-branch-select').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      
      updatePaymentTotals();
    }

    function setupUIForUser() {
      document.getElementById('pos-staff-badge').textContent = `STAFF: ${state.user.name} (${state.user.role})`;
      const branchSel = document.getElementById('admin-branch-select');
      if (state.user.role === 'admin' && state.user.branch === 'All') {
        branchSel.classList.remove('hidden');
      } else {
        branchSel.classList.add('hidden');
      }
    }

    function getActiveBranch() {
      if (state.user.role === 'admin' && state.user.branch === 'All') {
        return document.getElementById('admin-branch-select').value;
      }
      return state.user.branch;
    }

    // ==========================================
    // INVENTORY MANAGEMENT
    // ==========================================
    function showInvError(msg) {
      const listDiv = document.getElementById('inventory-list');
      listDiv.innerHTML = '';
      
      const wrap = document.createElement('div');
      wrap.style.cssText = "padding:15px; text-align:center; color:#dc3545;";
      
      const textNode = document.createElement('span');
      textNode.textContent = msg;
      wrap.appendChild(textNode);
      
      wrap.appendChild(document.createElement('br'));
      wrap.appendChild(document.createElement('br'));
      
      const btn = document.createElement('button');
      btn.style.cssText = "width:auto; padding:8px 16px;";
      btn.textContent = "Retry";
      btn.addEventListener('click', fetchInventory);
      
      wrap.appendChild(btn);
      listDiv.appendChild(wrap);
    }

    async function fetchInventory() {
      const listDiv = document.getElementById('inventory-list');
      listDiv.innerHTML = '<div style="padding:15px; text-align:center; color:#666;">Loading inventory...</div>';
      try {
        const data = await apiCall("getLiveInventory", { branch: getActiveBranch() });
        if (data.success && data.inventory) {
          state.inventory = data.inventory;
          populateCategories();
          renderInventory();
        } else {
          showInvError(data.error || "Failed to load inventory.");
        }
      } catch (err) {
        if (err.message !== "Session expired. Please login again.") {
          showInvError(err.message);
        }
      }
    }

    function populateCategories() {
      const catSelect = document.getElementById('inv-category');
      const currentVal = catSelect.value;
      
      const cats = new Set(state.inventory.map(i => i.category).filter(Boolean));
      catSelect.innerHTML = '';
      
      const allOpt = document.createElement('option');
      allOpt.value = "All";
      allOpt.textContent = "All Categories";
      catSelect.appendChild(allOpt);

      Array.from(cats).sort().forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        catSelect.appendChild(opt);
      });
      
      if (cats.has(currentVal)) catSelect.value = currentVal;
    }

    function renderInventory() {
      const listDiv = document.getElementById('inventory-list');
      const searchTerm = document.getElementById('inv-search').value.toLowerCase();
      const catFilter = document.getElementById('inv-category').value;
      
      listDiv.innerHTML = '';
      state.selectedItem = null;
      document.getElementById('selected-price').value = "0.00";
      document.getElementById('add-to-cart-btn').disabled = true;

      const filtered = state.inventory.filter(item => {
        const matchesSearch = item.item.toLowerCase().includes(searchTerm);
        const matchesCat = catFilter === "All" || item.category === catFilter;
        return matchesSearch && matchesCat;
      });

      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = "padding:15px; text-align:center; color:#666;";
        empty.textContent = "No items found.";
        listDiv.appendChild(empty);
        return;
      }

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = `inv-item ${item.stock <= 0 ? 'out-of-stock' : ''}`;
        
        const details = document.createElement('div');
        details.className = "inv-item-details";
        
        const name = document.createElement('span');
        name.className = "inv-item-name";
        name.textContent = item.item;
        
        const meta = document.createElement('span');
        meta.className = "inv-item-meta";
        meta.textContent = `${item.category} | Stock: ${item.stock}`;
        
        details.appendChild(name);
        details.appendChild(meta);

        const price = document.createElement('span');
        price.className = "inv-item-price";
        price.textContent = Number(item.price).toFixed(2);

        div.appendChild(details);
        div.appendChild(price);

        if (item.stock > 0) {
          div.addEventListener('click', () => {
            document.querySelectorAll('.inv-item').forEach(el => el.classList.remove('selected'));
            div.classList.add('selected');
            state.selectedItem = item;
            document.getElementById('selected-price').value = Number(item.price).toFixed(2);
            document.getElementById('qty-input').value = 1;
            document.getElementById('add-to-cart-btn').disabled = false;
          });
        }
        listDiv.appendChild(div);
      });
    }

    // ==========================================
    // CART MANAGEMENT
    // ==========================================
    function handleAddToCart() {
      if (!state.selectedItem) return;
      if (!checkPendingWarning()) return;
      
      const qty = parseInt(document.getElementById('qty-input').value, 10);
      if (isNaN(qty) || qty < 1) {
        alert("Quantity must be at least 1");
        return;
      }

      const existing = state.cart.find(c => c.item === state.selectedItem.item);
      const currentCartQty = existing ? existing.qty : 0;
      
      if (currentCartQty + qty > state.selectedItem.stock) {
        alert(`Cannot add more. Stock available: ${state.selectedItem.stock}`);
        return;
      }

      if (existing) {
        existing.qty += qty;
      } else {
        state.cart.push({
          item: state.selectedItem.item,
          price: state.selectedItem.price,
          qty: qty
        });
      }

      saveCart();
      renderCart();
      
      document.querySelectorAll('.inv-item').forEach(el => el.classList.remove('selected'));
      state.selectedItem = null;
      document.getElementById('selected-price').value = "0.00";
      document.getElementById('qty-input').value = 1;
      document.getElementById('add-to-cart-btn').disabled = true;
    }

    function removeCartItem(index) {
      if (!checkPendingWarning()) return;
      state.cart.splice(index, 1);
      saveCart();
      renderCart();
    }

    function updateCartItemQty(index, newQty) {
      const qty = parseInt(newQty, 10);
      if (!isNaN(qty) && qty >= 1) {
        state.cart[index].qty = qty;
        saveCart();
        renderCart();
      } else {
        renderCart(); 
      }
    }

    function updateCartItemOverride(index, overrideVal) {
      if (overrideVal.trim() === "") {
        delete state.cart[index].priceOverride;
      } else {
        const val = parseFloat(overrideVal);
        if (!isFinite(val) || val <= 0) {
          alert("Invalid override price. Must be a finite number above 0.");
          delete state.cart[index].priceOverride;
        } else {
          state.cart[index].priceOverride = val;
        }
      }
      saveCart();
      renderCart();
    }

    function saveCart() {
      localStorage.setItem('ana_pos_cart', JSON.stringify(state.cart));
      updatePaymentTotals();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      container.innerHTML = '';
      
      if (state.cart.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = "text-align:center; color:#888; font-size:0.8rem;";
        empty.textContent = "Cart is empty";
        container.appendChild(empty);
        document.getElementById('cart-total').textContent = "TOTAL: 0.00";
        updatePaymentTotals();
        return;
      }

      let total = 0;
      
      state.cart.forEach((c, index) => {
        const displayPrice = (state.user && state.user.role === 'admin' && c.priceOverride !== undefined && !isNaN(c.priceOverride)) 
                              ? c.priceOverride 
                              : c.price;
        const lineTotal = round2(displayPrice * c.qty);
        total = round2(total + lineTotal);

        const itemDiv = document.createElement('div');
        itemDiv.className = 'cart-item';
        
        const headerDiv = document.createElement('div');
        headerDiv.className = 'cart-item-header';
        
        const nameSpan = document.createElement('span');
        nameSpan.textContent = c.item;
        
        const totalSpan = document.createElement('span');
        totalSpan.textContent = lineTotal.toFixed(2);
        
        headerDiv.appendChild(nameSpan);
        headerDiv.appendChild(totalSpan);

        const controlsDiv = document.createElement('div');
        controlsDiv.className = 'cart-item-controls';
        
        const qtyLabel = document.createElement('span');
        qtyLabel.textContent = "Qty:";
        
        const qtyInput = document.createElement('input');
        qtyInput.type = "number";
        qtyInput.min = "1";
        qtyInput.value = c.qty;
        qtyInput.style.width = "70px";
        qtyInput.addEventListener('focus', handleInputFocus);
        qtyInput.addEventListener('change', (e) => updateCartItemQty(index, e.target.value));
        
        controlsDiv.appendChild(qtyLabel);
        controlsDiv.appendChild(qtyInput);

        if (state.user && state.user.role === 'admin') {
          const overInput = document.createElement('input');
          overInput.type = "number";
          overInput.step = "0.01";
          overInput.placeholder = "Override Price";
          overInput.style.width = "120px";
          if (c.priceOverride !== undefined) overInput.value = c.priceOverride;
          overInput.addEventListener('focus', handleInputFocus);
          overInput.addEventListener('change', (e) => updateCartItemOverride(index, e.target.value));
          controlsDiv.appendChild(overInput);
        } else {
          const priceDisplay = document.createElement('span');
          priceDisplay.style.color = "#666";
          priceDisplay.style.fontSize = "0.8rem";
          priceDisplay.style.marginLeft = "10px";
          priceDisplay.textContent = `@ ${Number(c.price).toFixed(2)}`;
          controlsDiv.appendChild(priceDisplay);
        }

        const rmBtn = document.createElement('button');
        rmBtn.className = 'btn-remove';
        rmBtn.textContent = 'X';
        rmBtn.style.marginLeft = 'auto';
        rmBtn.addEventListener('click', () => removeCartItem(index));
        controlsDiv.appendChild(rmBtn);

        itemDiv.appendChild(headerDiv);
        itemDiv.appendChild(controlsDiv);
        container.appendChild(itemDiv);
      });

      document.getElementById('cart-total').textContent = "TOTAL: " + total.toFixed(2);
      updatePaymentTotals();
    }

    // ==========================================
    // PAYMENT & CHECKOUT
    // ==========================================
    function getVal(id) {
      const val = parseFloat(document.getElementById(id).value);
      return isNaN(val) ? 0 : val;
    }

    function updatePaymentTotals() {
      let cartTotal = 0;
      state.cart.forEach(c => {
        const displayPrice = (state.user && state.user.role === 'admin' && c.priceOverride !== undefined && !isNaN(c.priceOverride)) ? c.priceOverride : c.price;
        const lineTotal = round2(displayPrice * c.qty);
        cartTotal = round2(cartTotal + lineTotal);
      });

      const moneyIn = round2(getVal('cash-in') + getVal('momo-in') + getVal('bank-in'));
      const moneyOut = round2(getVal('cash-out') + getVal('momo-out'));
      const netPaid = round2(moneyIn - moneyOut);
      const balance = round2(cartTotal - netPaid);

      document.getElementById('sum-total').textContent = cartTotal.toFixed(2);
      document.getElementById('sum-paid').textContent = netPaid.toFixed(2);
      
      const balEl = document.getElementById('sum-balance');
      balEl.textContent = balance.toFixed(2);
      
      const btn = document.getElementById('checkout-btn');
      const err = document.getElementById('checkout-error');
      const nameContainer = document.getElementById('cust-name-container');

      if (netPaid > cartTotal && cartTotal > 0) {
        balEl.style.color = "#dc3545"; 
        btn.disabled = true;
        btn.textContent = "ENTER CHANGE GIVEN";
        err.style.display = 'none';
        nameContainer.classList.add('hidden');
      } else {
        balEl.style.color = balance > 0 ? "#d97706" : "#16a34a"; 
        btn.disabled = state.cart.length === 0;
        btn.textContent = "SUBMIT SALE";
        
        if (balance > 0 && cartTotal > 0) {
          nameContainer.classList.remove('hidden');
        } else {
          nameContainer.classList.add('hidden');
        }
      }
    }

    async function handleCheckout() {
      if (state.cart.length === 0) return;

      const btn = document.getElementById('checkout-btn');
      const err = document.getElementById('checkout-error');
      err.style.display = 'none';
      
      const custName = document.getElementById('cust-name').value.trim();
      const balance = round2(parseFloat(document.getElementById('sum-balance').textContent) || 0);

      if (balance > 0 && custName === "") {
        err.textContent = "Enter customer name for credit";
        err.style.display = 'block';
        return;
      }

      const payload = {
        cart: state.cart.map(c => {
          const itemPayload = { item: c.item, qty: c.qty };
          if (state.user && state.user.role === 'admin' && c.priceOverride !== undefined && c.priceOverride !== "") {
            itemPayload.priceOverride = c.priceOverride;
          }
          return itemPayload;
        }),
        cashIn: getVal('cash-in'),
        momoIn: getVal('momo-in'),
        bankIn: getVal('bank-in'),
        cashOut: getVal('cash-out'),
        momoOut: getVal('momo-out'),
        customerType: document.getElementById('cust-type').value,
        customerName: custName,
        branch: getActiveBranch()
      };

      btn.disabled = true;
      btn.textContent = "PROCESSING...";

      try {
        const data = await apiCall("processCheckout", payload, true);
        
        if (!data.success) {
          err.textContent = data.error || "Transaction failed at server.";
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = "SUBMIT SALE";
          return;
        }

        document.getElementById('success-trans-id').textContent = data.transId || "LOGGED";
        document.getElementById('success-screen').style.display = 'flex';
        
        state.cart = [];
        localStorage.removeItem('ana_pos_cart');
        localStorage.removeItem('ana_pos_pending_req');
        
        fetchInventory();

      } catch (e) {
        if (e.message.includes("Session expired")) return;
        err.textContent = "Network Error: " + e.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = "NOT CONFIRMED, TAP TO RETRY";
        
        const pendingStr = localStorage.getItem('ana_pos_pending_req');
        if (pendingStr) {
          const pending = JSON.parse(pendingStr);
          pending.uncertain = true;
          localStorage.setItem('ana_pos_pending_req', JSON.stringify(pending));
        }
      }
    }

    function resetAppUI() {
      renderCart(); 
      document.getElementById('cust-type').value = "Unknown";
      document.getElementById('cust-name').value = "";
      document.getElementById('cash-in').value = "0";
      document.getElementById('momo-in').value = "0";
      document.getElementById('bank-in').value = "0";
      document.getElementById('cash-out').value = "0";
      document.getElementById('momo-out').value = "0";
      
      document.getElementById('checkout-error').style.display = 'none';
      document.getElementById('success-screen').style.display = 'none';
      
      updatePaymentTotals();
    }

    // ==========================================
    // EVENT BINDINGS
    // ==========================================
    function bindEvents() {
      document.getElementById('pin-input').addEventListener('keyup', (e) => {
        if (e.key === 'Enter') handleLogin();
      });
      document.getElementById('login-btn').addEventListener('click', () => handleLogin());
      document.getElementById('logout-btn').addEventListener('click', () => handleLogout());
      
      document.getElementById('admin-branch-select').addEventListener('focus', handleInputFocus);
      document.getElementById('admin-branch-select').addEventListener('change', () => fetchInventory());
      
      document.getElementById('inv-search').addEventListener('input', () => renderInventory());
      document.getElementById('inv-category').addEventListener('change', () => renderInventory());
      
      document.getElementById('add-to-cart-btn').addEventListener('click', () => handleAddToCart());
      
      document.getElementById('cust-type').addEventListener('focus', handleInputFocus);
      document.getElementById('cust-name').addEventListener('focus', handleInputFocus);

      document.querySelectorAll('.pay-input').forEach(input => {
        input.addEventListener('focus', handleInputFocus);
        input.addEventListener('input', () => updatePaymentTotals());
      });

      document.getElementById('checkout-btn').addEventListener('click', () => handleCheckout());
      document.getElementById('new-sale-btn').addEventListener('click', () => resetAppUI());
    }
  </script>
</body>
</html>
